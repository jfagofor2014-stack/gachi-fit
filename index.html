<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="manifest.json" />
  <title>GACHI-FIT</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <span class="logo">GACHI<span class="accent">-FIT</span></span>
    <div class="env-seg" id="env-seg" role="group" aria-label="トレーニング環境">
      <button type="button" data-env="home" aria-pressed="false">🏠 自宅</button>
      <button type="button" data-env="gym" aria-pressed="true">🏋 ジム</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabbar">
    <button data-route="home" class="tab active">ホーム</button>
    <button data-route="workout" class="tab">記録</button>
    <button data-route="analysis" class="tab">分析</button>
    <button data-route="manage" class="tab">管理</button>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
